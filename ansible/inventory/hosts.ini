# ==============================================================================
# Ansible Inventory for Space Invaders EC2 Host
# ==============================================================================
# Instructions:
# 1. Replace EC2_PUBLIC_IP_OR_DNS with your EC2 instance's public IP or DNS
#    (obtained from `terraform output ec2_public_ip` after terraform apply)
# 2. Replace /path/to/your-key.pem with the full path to your EC2 SSH private key
# 3. NEVER commit this file with real IP addresses or key paths if they are sensitive
# ==============================================================================

[space_invaders]
ec2_host ansible_host=EC2_PUBLIC_IP_OR_DNS

[space_invaders:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=/path/to/your-key.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[all:vars]
ansible_python_interpreter=/usr/bin/python3
