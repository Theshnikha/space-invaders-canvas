---
# ==============================================================================
# Kubernetes Deployment for Space Invaders Application
# ==============================================================================
# Deploys the Space Invaders Nginx container from DockerHub.
# Uses rolling update strategy for zero-downtime deployments.
#
# Before applying:
# 1. Replace YOUR_DOCKERHUB_USERNAME with your actual DockerHub username.
# 2. Ensure the image has been pushed to DockerHub via Jenkins pipeline.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: space-invaders
  namespace: space-invaders
  labels:
    app: space-invaders
    version: "1.0"
spec:
  # Number of replicas for high availability
  replicas: 2

  # Rolling update: always keep at least 1 pod running during update
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: space-invaders

  template:
    metadata:
      labels:
        app: space-invaders
        version: "1.0"
    spec:
      # Graceful termination period
      terminationGracePeriodSeconds: 30

      containers:
        - name: space-invaders
          # Replace YOUR_DOCKERHUB_USERNAME with your DockerHub username
          # This image is built and pushed via Jenkins CI/CD pipeline
          image: YOUR_DOCKERHUB_USERNAME/space-invaders:1.0
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          envFrom:
            - configMapRef:
                name: space-invaders-config

          # Resource limits prevent this pod from consuming excess cluster resources
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          # Liveness probe: restart pod if Nginx stops responding
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # Readiness probe: only send traffic when app is ready
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # Security: run as non-root user
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false

      # Pod-level security context
      securityContext:
        fsGroup: 101
